name: Refactor Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: refactor-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check src/ tests/ benchmarks/
      - run: uv run ruff format --check src/ tests/ benchmarks/
      - run: uv run mypy src/lattice/ --ignore-missing-imports
      - run: uv run pytest tests/ -q --tb=short
      - run: uv run pytest tests/contract/ -q --tb=short
      - run: uv run python scripts/generate_factories.py
      - run: git diff --exit-code src/lattice/pipeline/_generated_factories.py
      - run: bash scripts/check_code_budget.sh
      - run: bash scripts/check_internal_no_duplication.sh
      - run: bash scripts/check_sdk_no_algorithm_duplication.sh
      # Phase 10: canonical benchmark entrypoint (see docs/refactor/09-benchmarks.md).
      - run: test -x scripts/run_canonical_benchmark.sh
